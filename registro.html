<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="contenedor pequeño">
    <div class="cabecera-formulario">
        <span>NUEVO REGISTRO</span>
        <h1>Crear usuario</h1>
        <p>Ingresa los datos del nuevo usuario.</p>
    </div>
    <section class="tarjeta formulario">
        <form action="/Crear" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ej: juan@email.com" required>

            <div class="botones-formulario">
                <a href="/" class="boton boton-secundario">Cancelar</a>
                <button type="submit" class="boton boton-principal">Crear usuario</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
