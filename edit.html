```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="contenedor pequeño">
    <div class="cabecera-formulario">
        <span>EDITAR REGISTRO</span>
        <h1>Modificar usuario</h1>
        <p>Usuario #{{ usuario.id }}</p>
    </div>

    <section class="tarjeta formulario">
        <form action="/Editar/{{ usuario.id }}" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" value="{{ usuario.apellido }}" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" value="{{ usuario.email }}" required>

            <div class="botones-formulario">
                <a href="/usuario/{{ usuario.id }}" class="boton boton-secundario">Cancelar</a>
                <button type="submit" class="boton boton-principal">Guardar cambios</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
